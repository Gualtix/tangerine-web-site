<path d="M16 7c0-3 2-5 5-5-1 3-2 5-5 5z" fill="#fff"/>
<path d="M10 15c1-3 4-4 6-4" stroke="#E99B3F" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
