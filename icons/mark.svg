<!-- Master source for every app icon, favicon and splash: the header logo mark in white. generate.sh copies
     every line except the svg tags and this comment into each layout, so keep those tags on their own lines.
     The highlight is drawn in the tangerine background colour, so it reads as a cut-out on any tile. -->
